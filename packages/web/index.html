    <!-- Set the appearance before first paint so the dark theme never flashes. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('cardstock.appearance')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#282622' : '#faf8f3')
        } catch (e) {}
      })()
    </script>
