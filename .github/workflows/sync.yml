name: sync

# Offers change on the banks' own schedule, so twice a day is plenty. The job
# fetches, validates, commits the run counters, then builds and deploys in the
# same run, so fresh data never waits on a second trigger.
on:
  schedule:
    # 06:10 and 18:10 Asia/Colombo.
    - cron: '40 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      # Four banks answer a plain client with a challenge or render client side,
      # so their pages are fetched with a browser.
      - name: Install the browser for those sources
        run: npx playwright install --with-deps chromium

      # CI starts from a fresh checkout and data/offers.jsonl is not committed,
      # so the canonical store rides in a cache. Without it, a source that sits a
      # run out would take its bank off the site until the next good run.
      - name: Restore the canonical store
        uses: actions/cache@v4
        with:
          path: data/offers.jsonl
          key: offers-${{ github.run_id }}
          restore-keys: offers-

      # Availability is not quality, so the sync no longer fails on a source
      # that breaks its guards: that source sits the run out and the probe is
      # the alarm. The sync only fails when no source answered at all.
      - name: Sync
        run: |
          set -o pipefail
          npm run sync 2>&1 | tee -a "$RUNNER_TEMP/sync.log"

      - name: Build chunks
        run: |
          set -o pipefail
          npm run chunk 2>&1 | tee -a "$RUNNER_TEMP/sync.log"

      - name: Commit the run
        run: |
          git config user.name 'cardstock bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A good run clears the record of the last bad one.
          if [ -f data/last-failure.log ]; then
            git rm -q data/last-failure.log
          fi
          git add data/latest.json data/runs.json
          if git diff --cached --quiet; then
            echo 'run counters unchanged'
          else
            git commit -m "data: $(date -u '+%Y-%m-%d %H:%MZ')"
            # A code push may have landed while this ran.
            git pull --rebase origin main
            git push
          fi

      - name: Build
        env:
          BASE_PATH: /
        run: npm run build

      - name: Check the build output
        run: node scripts/check-build.mts

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

      - id: pages
        uses: actions/deploy-pages@v5

      # A failed run says what it said in the run summary and in the repo, so the
      # reason is readable without a token. Last, so it catches any step that
      # failed above it, and best effort, so it cannot become the story.
      - name: Record a failure
        if: failure()
        run: |
          set +e
          {
            echo "the pipeline failed on $(date -u '+%Y-%m-%d %H:%MZ') at ${GITHUB_SHA:0:7}"
            tail -n 300 "$RUNNER_TEMP/sync.log" 2>/dev/null || echo 'no sync or chunk output captured'
          } > data/last-failure.log
          {
            echo '## The pipeline failed'
            echo ''
            echo '```'
            cat data/last-failure.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'cardstock bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B main
          git add -f data/last-failure.log
          git commit -m "data: record a failed run"
          git pull --rebase origin main
          git push origin main
          exit 0
