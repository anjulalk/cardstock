name: sync

# Offers change on the banks' own schedule, so twice a day is plenty. The job
# fetches, validates, commits the run counters, then builds and deploys in the
# same run, so fresh data never waits on a second trigger.
on:
  schedule:
    # 06:10 and 18:10 Asia/Colombo.
    - cron: '40 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      # Four banks answer a plain client with a challenge or render client side,
      # so their pages are fetched with a browser.
      - name: Install the browser for those sources
        run: npx playwright install --with-deps chromium

      # Validation runs before anything is written, so a source that breaks
      # fails the job instead of publishing half its offers.
      - name: Sync
        run: npm run sync 2>&1 | tee "$RUNNER_TEMP/sync.log"

      - name: Record a failure
        if: failure()
        run: |
          mkdir -p data
          {
            echo "sync failed on $(date -u '+%Y-%m-%d %H:%MZ') at ${GITHUB_SHA:0:7}"
            tail -n 250 "$RUNNER_TEMP/sync.log" 2>/dev/null || echo 'no log captured'
          } > data/last-failure.log
          git config user.name 'cardstock bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/last-failure.log
          git commit -m "data: record a failed sync"
          git pull --rebase origin main
          git push

      - name: Build chunks
        run: npm run chunk

      - name: Commit the run
        run: |
          git config user.name 'cardstock bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/runs.json
          if git diff --cached --quiet; then
            echo 'run counters unchanged'
          else
            git commit -m "data: $(date -u '+%Y-%m-%d %H:%MZ')"
            # A code push may have landed while this ran.
            git pull --rebase origin main
            git push
          fi

      - name: Build
        env:
          BASE_PATH: /
        run: npm run build

      - name: Check the build output
        run: |
          echo "Checking the built site..."
          test -f packages/web/dist/index.html
          test -f packages/web/dist/sitemap.xml
          test -f packages/web/dist/data/index.json
          grep -q 'og:image' packages/web/dist/index.html
          echo "bank-months: $(find packages/web/dist/data/m -name '*.json' | wc -l)"
          echo "site size:   $(du -sh packages/web/dist | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

      - id: pages
        uses: actions/deploy-pages@v4
