name: probe

# The fixture tests prove the parsers still read the shape they were written
# for. This proves the shape is still there. A bank redesign fails the job and
# GitHub mails the owner, which is the whole notification system.
on:
  schedule:
    # 06:45 Asia/Colombo, ahead of the first sync.
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Without a browser the two filtered sources are skipped rather than
      # probed, which would leave them unwatched.
      - name: Install the browser for the filtered sources
        run: npx playwright install --with-deps chromium

      - name: Probe the live sources
        run: npm run probe
