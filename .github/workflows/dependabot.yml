name: dependabot

# Dependabot's own runs get a read-only token, so the review happens here, in
# the base repository's context. Nothing from the pull request is checked out or
# executed, which is what keeps pull_request_target safe.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@v3
        id: meta
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Approve, wait for the checks this pull request started, then merge. The
      # wait is the point: an update that breaks the build never lands on its own.
      - name: Approve a routine update and merge it once the checks pass
        id: merge
        if: contains(fromJSON('["version-update:semver-minor","version-update:semver-patch","security-update"]'), steps.meta.outputs.update-type)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! gh pr review --approve "$PR" 2>/tmp/review-error; then
            gh pr comment "$PR" --body "The approval did not go through: $(cat /tmp/review-error)"
            exit 1
          fi

          # Every check except this workflow's own, which is this job and would
          # never finish while the job waits for it. A skipped check counts as
          # fine, since the deploy job is skipped on a pull request.
          green() {
            gh pr checks "$PR" --json name,state \
              --jq '[.[] | select(.name != "review")] as $checks | ($checks | length > 0) and all($checks[]; .state == "SUCCESS" or .state == "SKIPPED")' 2>/dev/null
          }

          # Ten minutes covers a slow runner. After that the approval stays and
          # the merge is left to a person.
          for attempt in $(seq 1 30); do
            if [ "$(green)" = "true" ]; then break; fi
            sleep 20
          done

          if [ "$(green)" != "true" ]; then
            gh pr comment "$PR" --body "Approved. The checks are not green yet, so the merge is yours."
            exit 0
          fi

          if gh pr merge --squash --delete-branch --match-head-commit "$HEAD_SHA" "$PR"; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            gh pr comment "$PR" --body "Approved and the checks are green, but GitHub has not merged it yet. It may need a moment, or a look." || true
          fi

      - name: Release merged update
        if: steps.merge.outputs.merged == 'true' && contains(fromJSON('["version-update:semver-minor","version-update:semver-patch","security-update"]'), steps.meta.outputs.update-type)
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          if [[ "$UPDATE_TYPE" == 'version-update:semver-minor' ]]; then
            bump=minor
          else
            bump=patch
          fi
          gh workflow run release.yml --ref main -f bump="$bump"
      - name: Say what a major or unknown update needs
        if: contains(fromJSON('["version-update:semver-major","version-update:semver-unknown"]'), steps.meta.outputs.update-type)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR" --body "This one needs a person. A major or unknown jump can change behaviour, so it is not merged on its own."
