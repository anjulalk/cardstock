name: deploy

# Code pushes rebuild from the live sources, because the canonical offers are
# generated rather than committed. Bot run-counter commits are ignored here;
# they arrive with the sync workflow, which deploys itself.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Install the browser for the blocked sources
        run: npx playwright install --with-deps chromium

      - name: Sync
        run: npm run sync

      - name: Build chunks
        run: npm run chunk

      - name: Build
        env:
          BASE_PATH: /
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

      - id: pages
        uses: actions/deploy-pages@v4
