name: deploy

# Code pushes rebuild from the live sources, because the canonical offers are
# generated rather than committed. Bot run-counter commits are ignored here;
# they arrive with the sync workflow, which deploys itself.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Install the browser for the blocked sources
        run: npx playwright install --with-deps chromium

      # CI starts from a fresh checkout and data/offers.jsonl is not committed,
      # so the canonical store rides in a cache. Without it, a source that sits a
      # run out would take its bank off the site until the next good run.
      - name: Restore the canonical store
        uses: actions/cache@v4
        with:
          path: data/offers.jsonl
          key: offers-${{ github.run_id }}
          restore-keys: offers-

      - name: Sync
        run: |
          set -o pipefail
          npm run sync 2>&1 | tee -a "$RUNNER_TEMP/sync.log"

      - name: Build chunks
        run: |
          set -o pipefail
          npm run chunk 2>&1 | tee -a "$RUNNER_TEMP/sync.log"

      - name: Build
        env:
          BASE_PATH: /
        run: npm run build

      # A build that silently loses its data or its head tags should fail here,
      # not on the live site. The script prints every check, so a failure names
      # itself in the log rather than leaving a bare exit code.
      - name: Check the build output
        run: node scripts/check-build.mts

      # Pages reads its custom domain from the repository setting, not from the
      # CNAME file in the artifact, so a fresh repository serves only its
      # github.io address. The token this job holds can set it, which keeps the
      # deployment reproducible instead of a step someone has to remember. A
      # refusal fails the job, because the domain is part of the deployment.
      - name: Point Pages at the domain
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"cname":"cardstock.anjula.dev","build_type":"workflow"}')
          {
            echo "the pages api answered $code for the custom domain"
            cat /tmp/pages.json
            echo
          } | tee -a "$RUNNER_TEMP/sync.log"
          case "$code" in
            200|201|204) ;;
            *) exit 1 ;;
          esac

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

      - id: pages
        uses: actions/deploy-pages@v4

      # A failed run says what it said in the run summary and in the repo, so the
      # reason is readable without a token. Last, so it catches any step that
      # failed above it, and best effort, so it cannot become the story.
      - name: Record a failure
        if: failure()
        run: |
          set +e
          {
            echo "the pipeline failed on $(date -u '+%Y-%m-%d %H:%MZ') at ${GITHUB_SHA:0:7}"
            tail -n 300 "$RUNNER_TEMP/sync.log" 2>/dev/null || echo 'no sync or chunk output captured'
          } > data/last-failure.log
          {
            echo '## The pipeline failed'
            echo ''
            echo '```'
            cat data/last-failure.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'cardstock bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B main
          git add -f data/last-failure.log
          git commit -m "data: record a failed run"
          git pull --rebase origin main
          git push origin main
          exit 0
