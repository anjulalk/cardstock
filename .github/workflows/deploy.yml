name: deploy

# Code pushes rebuild from the live sources, because the canonical offers are
# generated rather than committed. Bot run-counter commits are ignored here;
# they arrive with the sync workflow, which deploys itself.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Install the browser for the blocked sources
        run: npx playwright install --with-deps chromium

      - name: Sync
        run: npm run sync 2>&1 | tee "$RUNNER_TEMP/sync.log"

      # A failed run leaves what it said in the repo, so the reason is readable
      # without a token and without opening the job log.
      - name: Record a failure
        if: failure()
        run: |
          mkdir -p data
          {
            echo "sync failed on $(date -u '+%Y-%m-%d %H:%MZ') at ${GITHUB_SHA:0:7}"
            tail -n 250 "$RUNNER_TEMP/sync.log" 2>/dev/null || echo 'no log captured'
          } > data/last-failure.log
          git config user.name 'cardstock bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/last-failure.log
          git commit -m "data: record a failed sync"
          git pull --rebase origin main
          git push

      - name: Build chunks
        run: npm run chunk

      - name: Build
        env:
          BASE_PATH: /
        run: npm run build

      # A build that silently loses its data or its head tags should fail here,
      # not on the live site.
      - name: Check the build output
        run: |
          echo "Checking the built site..."
          test -f packages/web/dist/index.html
          test -f packages/web/dist/sitemap.xml
          test -f packages/web/dist/robots.txt
          test -f packages/web/dist/og.png
          test -f packages/web/dist/icon-192.png
          test -f packages/web/dist/banks/hnb.png
          test -f packages/web/dist/data/index.json
          ls packages/web/dist/data/cards.*.json > /dev/null
          grep -q 'og:image' packages/web/dist/index.html
          grep -q 'application/ld+json' packages/web/dist/index.html
          grep -q 'rel="canonical"' packages/web/dist/index.html
          echo "bank-months: $(find packages/web/dist/data/m -name '*.json' | wc -l)"
          echo "data size:   $(du -sh packages/web/dist/data | cut -f1)"
          echo "site size:   $(du -sh packages/web/dist | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

      - id: pages
        uses: actions/deploy-pages@v4
